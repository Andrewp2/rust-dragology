[package]
name = "dragology"
version.workspace = true
edition = "2024"
description = "Renderer-independent, model-driven dragging"
license = "MIT"
repository = "https://github.com/Andrewp2/rust-dragology"

[dependencies]
kurbo = "0.13.1"
spade = "2.15.1"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace]
resolver = "3"
members = ["crates/*", "examples/hanoi", "examples/gallery"]
default-members = ["."]

[workspace.package]
version = "0.1.0-beta.1"
