name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  library:
    name: Library
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: library
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Test core and shared scene
        run: cargo +stable test --locked -p dragology -p dragology-scene
      - name: Lint core and shared scene
        run: cargo +stable clippy --locked -p dragology -p dragology-scene --all-targets -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --locked -p dragology -p dragology-scene --no-deps

  gallery:
    name: GPUI gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: gallery
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libfontconfig1-dev \
            libwayland-dev libxkbcommon-x11-dev fonts-dejavu-core
      - name: Test gallery models and integrations
        run: cargo +stable test --locked -p dragology-gallery --lib --tests
      - name: Build native gallery
        run: cargo +stable build --locked -p dragology-gallery --bin dragology-gallery
