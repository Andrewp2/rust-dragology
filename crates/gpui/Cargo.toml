[package]
name = "dragology-gpui"
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/Andrewp2/rust-dragology"

[dependencies]
dragology-scene = { path = "../scene" }
gpui = "0.2.2"

# gpui 0.2.2 pulls xattr 0.2 via zed-async-tar, which uses the Linux ENOATTR alias.
[target.'cfg(target_os = "linux")'.dependencies]
libc = ">=0.2.8, <0.2.190"

[dev-dependencies]
hanoi = { path = "../../examples/hanoi" }
