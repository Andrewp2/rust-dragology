[package]
name = "dragology-wgpu"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "wgpu renderer for Dragology model-driven dragging"
license = "MIT"
repository = "https://github.com/Andrewp2/rust-dragology"
readme = "README.md"
documentation = "https://docs.rs/dragology-wgpu"
keywords = ["drag-and-drop", "interaction", "gui", "wgpu"]
categories = ["gui", "rendering"]
# Native demos use the unpublished workspace-only Hanoi helper.
exclude = ["examples/"]

[dependencies]
dragology-scene = { path = "../scene", version = "=0.1.0-beta.2" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
hanoi = { path = "../../examples/hanoi" }
winit = "0.30"
pollster = "0.4"
